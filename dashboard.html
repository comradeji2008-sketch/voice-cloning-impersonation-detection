<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Authenticity Gauge</title>
<style>
  body {
    background: #0f1115;
    color: #e8e8e8;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }
  h1 { font-size: 18px; font-weight: 600; color: #9aa4b2; margin-bottom: 4px; }
  #callIdLabel { font-size: 13px; color: #5c6470; margin-bottom: 28px; }

  .gauge-wrap { position: relative; width: 260px; height: 260px; }
  svg { transform: rotate(-90deg); }
  circle.bg { fill: none; stroke: #1c1f26; stroke-width: 18; }
  circle.fg {
    fill: none;
    stroke-width: 18;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
  }
  .gauge-center {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score { font-size: 42px; font-weight: 700; }
  .tier-badge {
    margin-top: 10px; padding: 6px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  }
  .SAFE { background: #16351f; color: #4ade80; }
  .SUSPICIOUS { background: #3a2f10; color: #fbbf24; }
  .HIGH_RISK { background: #3a1414; color: #f87171; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  .log {
    margin-top: 32px; width: 420px; max-height: 160px; overflow-y: auto;
    background: #14161b; border-radius: 10px; padding: 12px 16px; font-size: 12px;
    color: #7c8492; font-family: ui-monospace, monospace;
  }
  .log div { padding: 2px 0; }
  #controls { margin-top: 20px; }
  button {
    background: #1c1f26; color: #e8e8e8; border: 1px solid #2a2e37;
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #23262e; }
  input {
    background: #1c1f26; color: #e8e8e8; border: 1px solid #2a2e37;
    padding: 8px 10px; border-radius: 8px; font-size: 13px; width: 140px; margin-right: 8px;
  }
</style>
</head>
<body>

<h1>VOICE AUTHENTICITY GAUGE</h1>
<div id="callIdLabel">not connected</div>

<div class="gauge-wrap">
  <svg width="260" height="260">
    <circle class="bg" cx="130" cy="130" r="108"></circle>
    <circle class="fg" id="fgCircle" cx="130" cy="130" r="108"
      stroke-dasharray="678.6" stroke-dashoffset="678.6" stroke="#4ade80"></circle>
  </svg>
  <div class="gauge-center">
    <div class="score" id="scoreText">0.00</div>
    <div class="tier-badge SAFE" id="tierBadge">SAFE</div>
  </div>
</div>

<div id="controls">
  <input id="callIdInput" placeholder="call id (e.g. demo1)" value="demo1">
  <button onclick="connect()">Connect</button>
  <button onclick="startDemo()">Run Demo Scenario</button>
</div>

<div class="log" id="log"></div>

<script>
const API_BASE = "http://localhost:8000";
const WS_BASE = "ws://localhost:8000";
let ws = null;

const CIRCUMFERENCE = 2 * Math.PI * 108;

function colorForTier(tier) {
  if (tier === "SAFE") return "#4ade80";
  if (tier === "SUSPICIOUS") return "#fbbf24";
  return "#f87171";
}

function applyState(state) {
  const scoreText = document.getElementById("scoreText");
  const tierBadge = document.getElementById("tierBadge");
  const fgCircle = document.getElementById("fgCircle");
  const log = document.getElementById("log");

  scoreText.textContent = state.score.toFixed(2);
  tierBadge.textContent = state.tier.replace("_", " ");
  tierBadge.className = "tier-badge " + state.tier;

  const offset = CIRCUMFERENCE * (1 - state.score);
  fgCircle.style.strokeDashoffset = offset;
  fgCircle.style.stroke = colorForTier(state.tier);

  const line = document.createElement("div");
  const time = new Date((state.timestamp || Date.now() / 1000) * 1000).toLocaleTimeString();
  let extra = "";
  if (state.watermark_detected) extra += " [WATERMARK HIT]";
  if (state.keyword_escalation) extra += " [FRAUD KEYWORD + BORDERLINE AUDIO]";
  line.textContent = `${time}  score=${state.score.toFixed(3)}  tier=${state.tier}${extra}`;
  log.prepend(line);
}

function connect() {
  const callId = document.getElementById("callIdInput").value.trim() || "demo1";
  if (ws) ws.close();
  ws = new WebSocket(`${WS_BASE}/ws/${callId}`);
  ws.onopen = () => {
    document.getElementById("callIdLabel").textContent = `connected: ${callId}`;
  };
  ws.onmessage = (event) => applyState(JSON.parse(event.data));
  ws.onclose = () => {
    document.getElementById("callIdLabel").textContent = "disconnected";
  };
}

async function startDemo() {
  const callId = document.getElementById("callIdInput").value.trim() || "demo1";
  if (!ws || ws.readyState !== WebSocket.OPEN) connect();
  await fetch(`${API_BASE}/calls/${callId}/demo`, { method: "POST" });
}
</script>

</body>
</html>
